<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>في انتظار إضافة المحل</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Tahoma", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #202124;
    }

    main {
      width: min(90%, 560px);
      padding: 42px 28px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .maps-logo {
      width: 86px;
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.6;
    }

    p {
      margin: 12px 0 0;
      color: #5f6368;
      font-size: 0.98rem;
    }
  </style>
</head>
<body>
  <main>
    <!-- شعار Google Maps مضمّن داخل الملف ولا يحتاج إلى اتصال بالإنترنت -->
    <svg class="maps-logo" viewBox="0 0 96 120" role="img" aria-label="Google Maps" xmlns="http://www.w3.org/2000/svg">
      <path fill="#34A853" d="M48 5C25.9 5 8 22.9 8 45c0 28.1 40 70 40 70s40-41.9 40-70C88 22.9 70.1 5 48 5Z"/>
      <path fill="#4285F4" d="M48 5C25.9 5 8 22.9 8 45c0 8.2 3.1 17.1 7.5 25.8L48 50V5Z"/>
      <path fill="#FBBC04" d="M48 5v45l32.5 20.8C85 61.9 88 53.2 88 45 88 22.9 70.1 5 48 5Z"/>
      <path fill="#EA4335" d="M48 5c-10.4 0-20 4-27.1 10.5L48 50l27.1-34.5C68 9 58.4 5 48 5Z"/>
      <circle cx="48" cy="45" r="15" fill="#fff"/>
      <circle cx="48" cy="45" r="8" fill="#4285F4"/>
    </svg>

    <h1>في انتظار إضافة المحل على Google</h1>
    <p>سيظهر الموقع هنا بعد إضافته إلى Google Maps.</p>
  </main>
</body>
</html>
